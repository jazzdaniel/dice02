<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#02180f" />
    <title>Carved Dice</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-table" aria-label="Wooden dice rolling prototype">
      <div class="table-inlay" aria-hidden="true"></div>

      <section class="dice-stage" aria-label="Press Space to roll the die">
        <div class="dice-shadow" aria-hidden="true"></div>
        <div class="dice" id="dice" role="img" aria-label="Die showing 1 on top">
          <div class="dice-face face-top" data-face="1">
            <span class="pip pip-center"></span>
          </div>
          <div class="dice-face face-front" data-face="2">
            <span class="pip pip-top-left"></span>
            <span class="pip pip-bottom-right"></span>
          </div>
          <div class="dice-face face-right" data-face="3">
            <span class="pip pip-top-left"></span>
            <span class="pip pip-center"></span>
            <span class="pip pip-bottom-right"></span>
          </div>
          <div class="dice-face face-left" data-face="4">
            <span class="pip pip-top-left"></span>
            <span class="pip pip-top-right"></span>
            <span class="pip pip-bottom-left"></span>
            <span class="pip pip-bottom-right"></span>
          </div>
          <div class="dice-face face-back" data-face="5">
            <span class="pip pip-top-left"></span>
            <span class="pip pip-top-right"></span>
            <span class="pip pip-center"></span>
            <span class="pip pip-bottom-left"></span>
            <span class="pip pip-bottom-right"></span>
          </div>
          <div class="dice-face face-bottom" data-face="6">
            <span class="pip pip-top-left"></span>
            <span class="pip pip-middle-left"></span>
            <span class="pip pip-bottom-left"></span>
            <span class="pip pip-top-right"></span>
            <span class="pip pip-middle-right"></span>
            <span class="pip pip-bottom-right"></span>
          </div>
        </div>
      </section>

      <section class="card-space" aria-label="Three face-down cards">
        <div class="card card-left" aria-hidden="true"><div class="card-pattern"></div></div>
        <div class="card card-center" aria-hidden="true"><div class="card-pattern"></div></div>
        <div class="card card-right" aria-hidden="true"><div class="card-pattern"></div></div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
