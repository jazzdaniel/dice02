<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#02180f" />
    <title>Carved Dice</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-table" aria-label="Wooden dice rolling prototype">
      <div class="table-inlay" aria-hidden="true"></div>

      <section class="dice-stage" aria-label="Press Space or R to roll the die">
        <div class="status-plaque target-plaque" aria-live="polite">
          <span class="plaque-label">Round <span id="round-value">1</span> · Target</span>
          <strong class="target-value" id="target-value">8</strong>
          <span class="target-progress"><span id="progress-value">0</span> / <span id="progress-target">8</span></span>
        </div>

        <div class="status-plaque tries-plaque" aria-live="polite">
          <span class="plaque-label">Tries</span>
          <div class="try-markers" id="try-markers" aria-hidden="true">
            <span class="try-marker"></span>
            <span class="try-marker"></span>
            <span class="try-marker"></span>
            <span class="try-marker"></span>
            <span class="try-marker"></span>
          </div>
          <span class="tries-count"><span id="tries-value">5</span> left</span>
        </div>

        <div class="status-plaque score-plaque" aria-live="polite">
          <span class="plaque-label">Round sum</span>
          <strong id="score-value">0</strong>
          <div class="score-markers" id="score-markers" aria-hidden="true">
            <span class="score-marker"></span>
            <span class="score-marker"></span>
            <span class="score-marker"></span>
          </div>
          <span class="scores-count"><span id="scores-value">3</span> scores</span>
        </div>

        <div class="dice-shadow" aria-hidden="true"></div>
        <div class="dice" id="dice" role="img" aria-label="Die showing 1 on top">
          <div class="dice-face face-top" data-face="1" data-value="1">
            <span class="pip pip-center"></span>
          </div>
          <div class="dice-face face-front" data-face="2" data-value="1">
            <span class="pip pip-center"></span>
          </div>
          <div class="dice-face face-right" data-face="3" data-value="1">
            <span class="pip pip-center"></span>
          </div>
          <div class="dice-face face-left" data-face="4" data-value="1">
            <span class="pip pip-center"></span>
          </div>
          <div class="dice-face face-back" data-face="5" data-value="1">
            <span class="pip pip-center"></span>
          </div>
          <div class="dice-face face-bottom" data-face="6" data-value="6">
            <span class="pip pip-top-left"></span>
            <span class="pip pip-middle-left"></span>
            <span class="pip pip-bottom-left"></span>
            <span class="pip pip-top-right"></span>
            <span class="pip pip-middle-right"></span>
            <span class="pip pip-bottom-right"></span>
          </div>
        </div>
      </section>

      <aside class="joker-area" id="joker-area" aria-label="Joker guide">
        <div class="joker-speech" id="joker-speech" role="status" aria-live="polite" aria-hidden="true">
          <span id="joker-line"></span>
        </div>
        <button class="joker-card is-awaiting" id="joker-card" type="button" aria-label="Reveal the trembling card">
          <span class="joker-card-inner">
            <span class="joker-card-face joker-card-back">
              <span class="joker-back-pattern"></span>
            </span>
            <span class="joker-card-face joker-card-front">
              <span class="joker-art" aria-hidden="true">
                <span class="joker-hat">
                  <i></i><i></i><i></i>
                </span>
                <span class="joker-head">
                  <i class="joker-eye eye-left"></i>
                  <i class="joker-eye eye-right"></i>
                  <i class="joker-grin"></i>
                </span>
                <span class="joker-collar"><i></i><i></i><i></i></span>
              </span>
              <strong>Joker</strong>
            </span>
          </span>
        </button>
      </aside>

      <section class="card-space" aria-label="Three face-down cards">
        <div class="action-panel" aria-label="Dice actions">
          <button class="game-button roll-button" id="roll-button" type="button">
            <span id="roll-label">Roll</span>
            <kbd>Space / R</kbd>
          </button>
          <button class="game-button score-button" id="score-button" type="button" disabled>
            <span>Score</span>
            <kbd>Enter / S</kbd>
          </button>
        </div>
        <button class="card table-card card-left" type="button" aria-label="Reveal empty card">
          <span class="table-card-inner">
            <span class="table-card-face table-card-back"><span class="card-pattern"></span></span>
            <span class="table-card-face table-card-front"><strong>Empty</strong></span>
          </span>
        </button>
        <button class="card table-card card-center" type="button" aria-label="Reveal empty card">
          <span class="table-card-inner">
            <span class="table-card-face table-card-back"><span class="card-pattern"></span></span>
            <span class="table-card-face table-card-front"><strong>Empty</strong></span>
          </span>
        </button>
        <button class="card table-card card-right" type="button" aria-label="Reveal empty card">
          <span class="table-card-inner">
            <span class="table-card-face table-card-back"><span class="card-pattern"></span></span>
            <span class="table-card-face table-card-front"><strong>Empty</strong></span>
          </span>
        </button>
      </section>

      <div class="loss-overlay" id="loss-overlay" role="status" aria-live="assertive" aria-hidden="true">
        <div class="loss-message">
          <span>You</span>
          <span>Lose</span>
          <span class="blood-drips" aria-hidden="true">
            <i class="blood-drip drip-one"></i>
            <i class="blood-drip drip-two"></i>
            <i class="blood-drip drip-three"></i>
            <i class="blood-drip drip-four"></i>
            <i class="blood-drip drip-five"></i>
          </span>
        </div>
      </div>

      <div class="round-overlay" id="round-overlay" role="status" aria-live="polite" aria-hidden="true">
        <div class="round-message" id="round-message">Round 1</div>
      </div>

      <div class="victory-overlay" id="victory-overlay" role="status" aria-live="assertive" aria-hidden="true">
        <div class="victory-message">You Won</div>
      </div>
    </main>

    <script src="balance.js"></script>
    <script src="game.js"></script>
  </body>
</html>
